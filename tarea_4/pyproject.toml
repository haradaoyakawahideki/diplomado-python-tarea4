[project]
name = "tarea4-agente-socioeconomico"
version = "0.1.0"
description = "Agente de investigación socioeconómica: MCP del BCRP + Skills de ENAHO"
requires-python = ">=3.11"
dependencies = ["fastmcp>=4,<5", "httpx", "pandas", "pyarrow", "geopandas", "matplotlib"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["mcp"]
pythonpath = ["mcp"]
